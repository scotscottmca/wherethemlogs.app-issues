name: Add an application
description: An application is missing from the index
title: "Add: "
labels: ["addition"]
body:
  - type: markdown
    attributes:
      value: |
        Paste paths **verbatim**. Environment variables stay unexpanded, and
        anything identifying gets redacted - `C:\Users\<username>\...` is as
        useful to us as the real thing.

  - type: textarea
    id: app
    attributes:
      label: Application
      description: The name people would search for.
      placeholder: Visual Studio Code
    validations:
      required: true

  - type: textarea
    id: vendor
    attributes:
      label: Vendor
      placeholder: Microsoft
    validations:
      required: true

  - type: textarea
    id: aliases
    attributes:
      label: Also known as
      description: Comma separated. What else might someone type?
      placeholder: vscode, code

  - type: textarea
    id: variant
    attributes:
      label: Variant
      description: Only if the app ships in more than one flavour that logs to different places.
      placeholder: Classic (v1)

  - type: checkboxes
    id: platforms
    attributes:
      label: Platform
      description: Tick every platform the paths below cover.
      options:
        - label: Windows
        - label: macOS
        - label: Linux

  - type: textarea
    id: paths
    attributes:
      label: Log path(s)
      description: One per line. Include what the file is, and which platform it belongs to if you ticked more than one.
      render: text
      placeholder: |
        Windows · Session logs · %APPDATA%\Code\logs\
        macOS   · Session logs · ~/Library/Application Support/Code/logs/
        Linux   · Session logs · ~/.config/Code/logs/
    validations:
      required: true

  - type: dropdown
    id: installer
    attributes:
      label: Installer type
      description: Which deployments do these paths hold true for? Pick as many as apply.
      multiple: true
      options:
        - msi
        - exe
        - msix
        - appx
        - pkg
        - dmg
        - mas
        - deb
        - rpm
        - snap
        - flatpak
        - appimage
        - Not sure

  - type: checkboxes
    id: architecture
    attributes:
      label: Architecture
      description: Tick as many as apply.
      options:
        - label: x86
        - label: x64
        - label: arm64
        - label: Not sure

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - per-user
        - per-machine
        - system
        - Not sure
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: How did you verify this?
      description: Your own machine is a fine answer. A vendor documentation link is better. A forum post of unknown vintage is the problem this index exists to solve.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Conditions the path depends on - a flag that has to be set, a version it changed in, a folder that only appears after a crash.

  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I have redacted hostnames, usernames, tenant identifiers and customer names.
          required: true
